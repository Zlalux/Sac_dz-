<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شكراً لطلبك - SAC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f7f4f0; color: #2d2d2d; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; padding: 40px 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; width: 100%; }
    .icon { font-size: 3.5rem; margin-bottom: 15px; }
    h1 { color: #1a1a1a; font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #555; font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; }
    .btn { display: inline-block; background: #1a1a1a; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛍️✨</div>
    <h1>شكراً لكِ على الطلب!</h1>
    <p>تم استلام طلبكِ بنجاح، وسيصلكِ في حدود يومين بإذن الله. سنقوم بالاتصال بكِ قريباً لتأكيد الشحن.</p>
    <a href="index.html" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
